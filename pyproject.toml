[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "coreinsight-fris"
version = "0.1.0"
description = "A traceable financial report intelligence pipeline"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.37,<2",
  "pymupdf>=1.24,<2",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["development/tests"]
